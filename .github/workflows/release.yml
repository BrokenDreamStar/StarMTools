name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: ./gradlew build

      # 读取 gradle.properties 中的版本号，作为 Release 的 tag
      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # 若该版本已发布过则跳过，避免重复 Release
      - name: Check release existence
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: StarMTools v${{ steps.version.outputs.version }}
          body: |
            ## StarMTools v${{ steps.version.outputs.version }}

            构建产物：StarMTools-v${{ steps.version.outputs.version }}.jar
          files: build/libs/StarMTools-*.jar
          fail_on_unmatched_files: true
