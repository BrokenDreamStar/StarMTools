name: StarMTools
version: '${version}'

main: team.starm.StarMTools
authors: [BrokenDream_Star, DeepSeek]
website: "https://starm.team/"
api-version: '26.1.2'
load: POSTWORLD
softdepend: [PlaceholderAPI]

commands:
  starmtools:
    description: "StarMTools main command"
    usage: "/starmtools reload"
  fly:
    description: "Toggle flight mode"
    usage: "/fly"
  serverinfo:
    description: "View server system information"
    usage: "/serverinfo"
  tpa:
    description: "Request to teleport to a player"
    usage: "/tpa <player>"
  tpahere:
    description: "Request a player to teleport to you"
    usage: "/tpahere <player>"
  back:
    description: "Teleport back to death point or last location"
    usage: "/back [confirm]"
  warp:
    description: "Teleport to a warp point"
    usage: "/warp <name>"
    aliases: [warplist]
  setwarp:
    description: "Set a warp point at your location"
    usage: "/setwarp <name>"
  delwarp:
    description: "Delete a warp point"
    usage: "/delwarp <name>"
  sethome:
    description: "Set a home at your current location"
    usage: "/sethome [name]"
  home:
    description: "Teleport to your home"
    usage: "/home [name]"
    aliases: [homes]
  delhome:
    description: "Delete a home"
    usage: "/delhome [name]"

permissions:
  starmtool.fly:
    description: "Allows use of /fly command"
    default: op
  starmtool.serverinfo:
    description: "Allows use of /serverinfo command"
    default: op
  starmtool.tpa:
    description: "Allows use of /tpa command"
    default: true
  starmtool.tpahere:
    description: "Allows use of /tpahere command"
    default: true
  starmtool.back:
    description: "Allows use of /back command"
    default: true
  starmtool.warp:
    description: "Allows use of /warp command"
    default: true
  starmtool.setwarp:
    description: "Allows use of /setwarp command"
    default: op
  starmtool.delwarp:
    description: "Allows use of /delwarp command"
    default: op
  starmtool.sethome:
    description: "Allows use of /sethome command"
    default: true
  starmtool.home:
    description: "Allows use of /home command"
    default: true
  starmtool.delhome:
    description: "Allows use of /delhome command"
    default: true
